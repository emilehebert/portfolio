{% set title = "Page introuvable | Émile Hébert" %}
{% include '_partials/_header.html' %}

<section class="error-404 has-bg-grid">
    <div class="bg-grid bg-grid--a" aria-hidden="true"></div>
    <div class="bg-grid bg-grid--b" aria-hidden="true"></div>
    <div class="wrapper">
        <div class="window">
            <div class="window__header">
                <p>Erreur 404</p>
                <a href="index.html" class="button button--secondary cursor-target" data-component="ScrambledText">X</a>                
            </div>
            <div class="window__content">
                <h1 data-component="ScrambledText" data-chars="0123456789X.=" data-duration="2" data-intro>404</h1>
                <h2 data-component="ScrambledText" data-duration="2" data-intro>Page <span class="accent--primary">introuvable</span></h2>
                <p>
                    La page que vous cherchez n'<span class="accent--primary">existe pas</span> ou a été <span class="accent--primary">déplacée</span>. Revenez à l'accueil pour continuer
                    la visite.
                </p>
            </div>
            <div class="window__footer">
                <a href="index.html" class="button button--secondary cursor-target" data-component="ScrambledText">Retour à l'accueil</a>
            </div>
        </div>
    </div>
</section>
</main>
